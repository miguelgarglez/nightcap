    (function () {
      // standalone-preview fallback: the assembler hoists this <video> to the host

      // the dead lead-in ourselves so the drag lands in the Scene windows.
      var v = document.querySelector(".bed4-video");
      if (v) {
        try { v.currentTime = 1.4; } catch (e) {}

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-bedtime"] = tl;

      // Scene 1 (0–0.8): kicker chrome lands over the establishing footage.
      tl.fromTo(
        ".bed4-chrome-rule",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        0.15
      );
      tl.fromTo(
        ".bed4-kicker",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.28
      );

      // Scene 2 (0.8–4.4): the footage drags the bed line upward (snap to 22:30
      // lands ~3.1 with media-start 1.4); the callout lands as it releases.
      tl.fromTo(
        ".bed4-callout-text",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.3
      );
      tl.fromTo(
        ".bed4-callout-leader",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.45, ease: "power2.inOut" },
        3.45

      tl.fromTo(
        ".bed4-callout-tick",
        { scaleY: 0, transformOrigin: "center top" },
        { scaleY: 1, duration: 0.3, ease: "power2.out" },
        3.72
      );

      // Scene 3 (4.4–5.5): verdict stamp — rule stub then masked word rise —
      // as the bed line settles at 22:00 (~4.7) and the ghost holds at 100%.
      tl.fromTo(
        ".bed4-payoff-rule",
        { scaleX: 0, transformOrigin: "center center" },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        4.5
      );

        { yPercent: 112 },
