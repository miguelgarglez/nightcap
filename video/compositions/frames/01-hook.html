    /* ---- frame ground: 1080x1080 square, dark register ---- */

    /* Stacking — assemble-index.mjs hoists data-frame-video clips to the host
       root AFTER the scene slot, so DOM order alone would bury this frame's
       overlays under the footage. The negative z-layers keep the order
       ground(-2) < footage(-1) < scene overlays(auto) in the shared context,
       and hold identically in standalone preview where the video is in-frame. */
    [id="01-hook-bg"]{
      position: absolute;
      inset: 0;
      background: #0B0E1A; /* ink-black */
      z-index: -2;

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-hook"] = tl;

      var $ = function (id) { return document.getElementById(id); };

      /* Signature move — ONE continuous decelerating zoom-out on the hero
         footage (zoom-out-workspace-reveal, adapted: the footage is the world).
         viewport-change single-wrapper form: composite transform
         translate(x,y) scale(S) about center, T = -offset x S. The ghost /
         bed-line region sits ~ (636,630) in frame space → offset (96,90) from
         center; at S = 1.25, T = (-120,-112.5) keeps it framed at open while
         holding full-bleed coverage. One fromTo lands scale 1 / translate 0 at
         t = 3.0 with expo.out; the frame locks and only the footage's own
         motion (fireflies, mist) carries on — no second camera move.
         (Direct element transform tween, not an onUpdate cam object: the
         renderer's seeks suppress update callbacks — GSAP transform props
         render deterministically on every seek.) */
      var vid = $("01-hook-video");
      if (vid) {
        vid.style.transformOrigin = "50% 50%";
        tl.fromTo(
          vid,
          { x: -120, y: -112.5, scale: 1.25 },
          { x: 0, y: 0, scale: 1, duration: 3.0, ease: "expo.out" },
          0
        );
        /* macro focus resolve chorded to the early pull (depth-of-field-blur
           settle variant — blur ramps to 0 as the zoom recedes) */
        tl.fromTo(
          vid,
          { filter: "blur(6px)" },
          { filter: "blur(0px)", duration: 1.3, ease: "power2.out" },
          0
        );
        /* brief materialize — the ghost is "already up", not cut-in cold */
        tl.fromTo(vid, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
      }

      /* Scene 1 (0-1.4s): hairline chrome bar + mono kicker fade in top-left */
      var bar = $("01-hook-bar");
      var kicker = $("01-hook-kicker");
      var num = $("01-hook-num");
      if (bar) tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.15);
      if (kicker) tl.fromTo(kicker, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.32);
      if (num) tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.55);

      /* Scene 2 (1.4-3.0s): hook line lands lower-third word-by-word as the
         pull decelerates; the amber underline accent sweeps in under the
         punch phrase and is complete by t = 3.0 (the poster frame). */
      var starts = [1.78, 2.06, 2.32];
      ["01-hook-line1", "01-hook-line2", "01-hook-line3"].forEach(function (lid, i) {
        var line = $(lid);
        if (!line) return;
        var words = Array.prototype.slice.call(line.getElementsByClassName("01-hook-w"));
        tl.fromTo(
          words,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 },
          starts[i]
        );
      });
      var rule = $("01-hook-rule");
      if (rule) tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 2.6);

      /* Scene 3 (3.0-4.0s): hold the read — footage alive, type still.
         No exit tween: this is not the final frame. */
      tl.seek(0);
    })();
